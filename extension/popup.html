<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { --bg: #fff; --text: #1c2430; --muted: #687385; --line: #e1e5eb; --accent: #1f6feb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b2027; --text: #e3e8ef; --muted: #8b95a5; --line: #2b323c; --accent: #4c8dff; } }
    body { width: 360px; margin: 0; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    #status { font-size: 12px; color: var(--muted); }
    #status.on::before { content: "\25CF "; color: #1a7f37; }
    #status.off::before { content: "\25CF "; color: #cf222e; }
    label { display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
    h4 { margin: 10px 12px 4px; font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .04em; }
    ul { list-style: none; margin: 0; padding: 0 0 6px; max-height: 220px; overflow: auto; }
    li input { margin: 0; }
    li.pick span { cursor: pointer; }
    .bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px 10px; border-top: 1px solid var(--line); }
    .bar label { padding: 0; border: 0; }
    button:disabled { opacity: .5; cursor: default; }
    li { display: flex; gap: 8px; align-items: center; padding: 6px 12px; }
    li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li small { color: var(--muted); }
    button { padding: 4px 10px; border: 0; border-radius: 5px; background: var(--accent); color: #fff; cursor: pointer; font: inherit; }
    .empty { padding: 4px 12px 12px; color: var(--muted); }
  </style>
</head>
<body>
  <header><strong>RDM</strong><span id="status">checking…</span></header>
  <label><input type="checkbox" id="capture"> Take over browser downloads</label>
  <h4>Media on this page</h4>
  <ul id="list"></ul>
  <h4>Files linked on this page</h4>
  <ul id="links"></ul>
  <div class="bar" id="links-bar">
    <label><input type="checkbox" id="all"> Select all</label>
    <button id="dl-links" disabled>Download selected</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
